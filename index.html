<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory：Me&GPT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
/* —— Base: 扁平化、无边框、统一圆角 —— */
:root{ --radius:16px }
body{
  font-family:"Helvetica Neue", Helvetica, Lato, Futura, system-ui, Segoe UI, Roboto;
  max-width:1080px; margin:32px auto; padding:16px; line-height:1.6;
  background:var(--bg); color:var(--text);
}
h1{ font-size:28px; font-weight:800; letter-spacing:.2px; margin:0 0 16px }
.h2{ font-size:18px; font-weight:700; margin:0 0 8px }
.mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1, "lnum" 1 }
.muted{ opacity:.76 }
.kpi{ font-size:clamp(28px,4vw,32px); font-weight:800; line-height:1.1 }
.kpi-row{ margin-top:6px }
.nowrap{ white-space:nowrap; word-break:keep-all }
.label{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.8 }
.sub{ font-size:13px; opacity:.7; margin-top:8px }
.sep{ height:1px; background:currentColor; opacity:.12; margin:8px 0 }
.hero-grid{
  display:grid; gap:16px;
  grid-template-columns:repeat(12,minmax(0,1fr));
  margin:16px 0 24px;
}
.hero{
  background:var(--card);
  border-radius:28px;
  padding:24px;
  color:var(--text);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.hero .label{ margin-bottom:4px }
.hero .metric-group{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-top:4px }
.hero .metric{ display:flex; flex-direction:column; gap:4px }
.hero .metric .kpi{ margin-top:4px }
.hero .metric .kpi-row{ margin-top:6px }
.hero .metric .kpi-row:first-of-type{ margin-top:4px }
.hero .sub{ margin-top:0 }
.hero-time #earliest{ display:block; max-width:14ch; word-break:break-word }
.hero-streak-grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); }
.hero-grid .hero{ grid-column:span 12 }
.hero-time .sep{ margin:12px 0 }
.hero-time .kpi:last-of-type{ font-size:clamp(22px,3vw,26px) }
.hero-streak-grid .kpi{ font-size:clamp(24px,4vw,30px) }
.hero-streak .sub{ margin-top:12px }
.card{
  background:var(--card); border:none; border-radius:var(--radius);
  padding:16px; margin:12px 0;
}
.grid{
  display:grid; gap:12px;
  grid-template-columns: repeat(12, minmax(0,1fr));
}
.col-12{grid-column:span 12}
.col-6{grid-column:span 6}
.col-4{grid-column:span 4}
.col-8{grid-column:span 8}
@media (max-width:860px){ .col-6,.col-4,.col-8{grid-column:span 12} }
.hero-grid .hero-time,.hero-grid .hero-streak{ grid-column:span 6 }
@media (max-width:860px){ .hero-grid .hero-time,.hero-grid .hero-streak{ grid-column:span 12 } }

.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.theme-row{ justify-content: flex-start; gap: 8px; }
@media (max-width:860px){ .theme-row{ justify-content:flex-start; } }
.input{ padding:8px 10px; border:none; border-radius:12px; background:var(--surface); color:var(--text) }
button{ padding:8px 12px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-contrast); cursor:pointer; font-weight:600 }
button.ghost{ background:var(--surface); color:var(--text) }
.theme{ font-weight:700; padding:6px 10px }
.theme[aria-pressed="true"]{ outline:2px solid var(--accent) }
#monthGrid{ display:block; margin-top:12px; }
.month{ margin:12px 0 16px; }
.month-title{ font-weight:800; font-size:16px; margin:4px 0 8px; }
.dow{ font-weight:700; text-align:center; margin:6px 0; }
.month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.day{
  min-height:60px;
  padding:8px;
  border-radius:var(--radius);
  background:var(--surface);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:flex-start;
  font-variant-numeric:tabular-nums;
}
.day.zero{ opacity:.45; }
.day.empty{ visibility:hidden; }
.day .d{ font-weight:700; }
.day .cnt{ font-size:12px; opacity:.9; }
@media (max-width:640px){ .month-grid{ gap:6px } .day{ min-height:54px; padding:6px } }

/* —— 主题（语义色：bg 最浅 / card 次浅 / surface 控件底 / accent 强调） —— */
body[data-theme="Echoes"]{
  --bg:#aac1b0; --card:#f2eee1; --surface:#a7acb7; --accent:#617ba2; --accent-contrast:#fff; --text:#102010;
}
body[data-theme="Logic"]{
  --bg:#c9c0dd; --card:#f4f4f4; --surface:#e2d8e9; --accent:#a395c2; --accent-contrast:#fff; --text:#111;
}
body[data-theme="Emotion"]{
  --bg:#eeeaeb; --card:#f4d0e2; --surface:#e696bf; --accent:#505050; --accent-contrast:#fff; --text:#1a1a1a;
}
body[data-theme="Retro"]{
  --bg:#bfa98b; --card:#e7e1d8; --surface:#d7b56c; --accent:#af5249; --accent-contrast:#fff; --text:#1a1a1a;
}
  
/* 顶部两行的小调整 —— 统一字号/字重 + 行距 + 主题行左对齐 */
.row label{ 
  font-weight:700; 
  font-size:14px; 
}

/* 让“主题”两字和上面 label 一致，不要半透明 */
.theme-row .muted{
  opacity:1;
  font-weight:700;
  font-size:14px;
  margin-right:8px;    /* 与按钮留一点距离 */
  line-height:1.2;
}

/* 行间距：两行别贴太近 */
.card > .row{ margin:6px 0; }
.theme-row{
  justify-content:flex-start;   /* 主题行左对齐 */
  gap:8px;
  margin-top:10px;
}

/* Highlights tile grid */
.hl-grid{
  display:grid;
  grid-template-columns: repeat(5, minmax(0,1fr)); /* desktop */
  gap:10px;
}
@media (max-width:1024px){ .hl-grid{ grid-template-columns: repeat(4,1fr); } }
@media (max-width:860px){  .hl-grid{ grid-template-columns: repeat(3,1fr); } }
@media (max-width:560px){  .hl-grid{ grid-template-columns: repeat(2,1fr); } }

.hl-tile{
  background: var(--surface);
  border-radius: var(--radius);
  min-height: 70px;
  padding: 8px 10px;
  display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start;
  font-variant-numeric: tabular-nums;
}
.hl-date{ font-weight:700; opacity:.95; }
.hl-chars{ font-size:12px; opacity:.95; }

/* Optional: stronger accent for Top 3 */
.hl-top1{ background: var(--accent); color: var(--accent-contrast); }
.hl-top2, .hl-top3{ box-shadow: 0 0 0 9999px rgba(0,0,0,0) inset; }

/* Highlights 5×2 小方块 —— 和月历 .day 同尺寸节奏 */
.hl-grid{
  display: grid;
  grid-template-columns: repeat(5, 1fr); /* 一行 5 个 */
  gap: 8px;                               /* 固定间距 */
  margin-top: 8px;
}
/* 方块尺寸=月历 .day：min-height 60px + padding 8px；去掉大块/等比拉伸 */
.hl-tile{
  background: var(--surface);
  border-radius: var(--radius);
  padding: 8px;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  font-variant-numeric: tabular-nums;
  /* 覆盖此前的大尺寸设置 */
  aspect-ratio: auto !important;
}
.hl-date{ font-weight: 700; line-height: 1.2; }
.hl-chars{ font-size: 12px; opacity: .9; }

/* 可选：仅高亮第 1 名 */
.hl-top1{ background: var(--accent); color: var(--accent-contrast); }

/* 1) 网格更稳：用 minmax(0,1fr) 避免 1fr + gap 的取整溢出 */
.month-grid{
  display:grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;                 /* 你的默认 gap */
  padding: 0 8px;           /* 给左右留内边距，避免贴边感 */
  box-sizing: border-box;
}

/* 2) 卡片裁剪圆角，防止网格在极小屏时“探出”卡片外沿 */
.card{ overflow: hidden; }

/* 3) 极窄屏下略收紧：减少 gap 与格子体量，防止换行溢出 */
@media (max-width: 420px){
  .month-grid{ gap: 6px; padding: 0 6px; }
  .day{ min-height: 56px; padding: 6px; } /* 和你现有月历节奏一致即可 */
}

/* —— Monthly 小方块：数字自适应，别再探出圆角 —— */
.day{ 
  box-sizing: border-box;
  overflow: hidden;                /* 防 0.5px 取整时出界 */
}
.day .d{                           /* 日期（上行） */
  font-weight: 700;
  line-height: 1.15;
  /* 超窄屏时自动变小；大屏回到原字号 */
  font-size: clamp(12px, 3.2vw, 14px);
}
.day .cnt{                         /* 字数（下行） */
  white-space: nowrap;             /* 不换行，保证在一行内 */
  line-height: 1.1;
  /* 自适应字号：窄屏变小，桌面回到 12px */
  font-size: clamp(10px, 2.6vw, 12px);
  letter-spacing: -0.1px;          /* 微调拥挤感 */
}

/* 极窄屏再收一点体量 */
@media (max-width: 420px){
  .month-grid{ gap: 6px; padding: 0 6px; }
  .day{ min-height: 56px; padding: 6px; }
}

/* —— Highlights 小方块也同步规则（可选） —— */
.hl-chars{ 
  white-space: nowrap;
  line-height: 1.1;
  font-size: clamp(10px, 2.6vw, 12px);
}
.hl-date{
  font-size: clamp(12px, 3.2vw, 14px);
  line-height: 1.15;
}

/* 让每个日格成为字体自适应的容器 */
.day{ 
  container-type:inline-size;      /* 开启容器单位 */
  padding: 6px 10px;               /* 右侧留量，避免贴圆角 */
  box-sizing:border-box;
  overflow:hidden;                 /* 防 0.5px 溢出 */
}

/* 日期（上行）与字数（下行）随格子宽度自适应，桌面复原到原字号 */
.day .d{
  font-weight:700; line-height:1.15;
  font-size: clamp(12px, 16cqw, 14px);  /* 小屏降一点，最大到14px */
}
.day .cnt{
  white-space:nowrap; line-height:1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing:-0.1px;
  font-size: clamp(10px, 14cqw, 12px);  /* 根据格子宽度自动收缩 */
}

/* 极窄屏：整体再紧一点 */
@media (max-width:420px){
  .month-grid{ gap:6px; padding:0 6px; }
  .day{ min-height:56px; }
}

/* 让每个日格按“自身宽度”自适应字号，并给左右留余量 */
.day{
  container-type: inline-size;     /* 启用 cqw 容器单位 */
  padding: 6px 12px;               /* 右侧多留点空间 */
  box-sizing: border-box;
  overflow: hidden;
}

/* 顶部日期与底部字数都占满一行、居中显示 */
.day .d,
.day .cnt{
  display: block;
  max-width: 100%;
  text-align: center;              /* 居中可避免右侧贴边 */
}

/* 自适应字号：随方块宽度缩放，桌面回到原大小 */
.day .d{
  font-weight: 700; line-height: 1.15;
  font-size: clamp(12px, 15cqw, 14px);
}
.day .cnt{
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.15px;
  font-size: clamp(10px, 11.5cqw, 12px); /* 比之前再收一点 */
}

/* 极窄屏再降一点体量（根据你机器可微调） */
@media (max-width: 420px){
  .month-grid{ gap: 6px; padding: 0 6px; }
  .day{ min-height: 56px; }
  .day .cnt{ font-size: clamp(10px, 10.5cqw, 12px); }
}

/* 高光方块也同步规则（可选） */
.hl-tile{ padding: 6px 12px; }
.hl-date{ text-align:center; font-size: clamp(12px, 15cqw, 14px); }
.hl-chars{ text-align:center; font-size: clamp(10px, 11.5cqw, 12px); }

/* 月历小方块：内容居中+自适应字号，避免被圆角裁掉 */
.day{
  padding: 6px 8px;                 /* 左右对称即可 */
  min-height: 56px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;              /* 关键：水平居中 */
  overflow: hidden;
}

.day .d,
.day .cnt{
  display: block;
  max-width: 100%;
  text-align: center;               /* 居中避免贴边 */
  white-space: nowrap;              /* 不换行 */
  font-variant-numeric: tabular-nums; /* 等宽数字更稳 */
  letter-spacing: 0;                /* 去掉负字距，避免右侧被挤 */
}

/* 自适应字号：再小一点，防 168,866 这类被裁 */
.day .d   { font-weight:700; line-height:1.15; font-size: clamp(12px, 2.8vw, 14px); }
.day .cnt { line-height:1.1;  font-size: clamp(10px, 2.1vw, 12px); }

@media (max-width:420px){
  .month-grid{ gap:6px; padding:0 6px; }
  .day{ min-height:54px; }
}

/* —— 月历日格：居中、等宽数字、防溢出 —— */
.day{
  padding: 6px 8px;
  min-height: 56px;
  box-sizing: border-box;
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: center;
  overflow: hidden;
}
.day .d,
.day .cnt{
  display: block; max-width: 100%;
  text-align: center; white-space: nowrap;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;                 /* 避免右侧被挤 */
}
.day .d   { font-weight: 700; line-height: 1.15; font-size: clamp(12px, 2.8vw, 14px); }
.day .cnt { line-height: 1.1;        font-size: clamp(10px, 2.0vw, 12px); }

/* —— 小屏“宽数字”专治：轻微横向压缩 + 再收一档字号 —— */
@media (max-width: 480px){
  .day{ padding: 6px 6px; }         /* 再挪出 2px 宽度给数字 */
  .day .cnt{
    font-size: clamp(9px, 1.8vw, 11px);
    transform: scaleX(.94);         /* 仅横向压缩 6% */
    transform-origin: center;
  }
}

</style>

</head>

<body data-theme="Echoes">
  <h1 id="title">Memory：Me&GPT</h1>

  <!-- 控制条 -->
<div class="card">

  <!-- Row 1: names + Save/Reset（这一行只有输入和两个按钮） -->
  <div class="row">
    <label>我方显示名（user）<input id="userName" class="input" placeholder="Me" type="text"></label>
    <label>对方显示名（assistant）<input id="assistantName" class="input" placeholder="GPT" type="text"></label>
    <button id="saveNames">保存并应用</button>
    <button id="resetNames" class="ghost">重置</button>
  </div>

  <!-- Row 2: 主题行（单独一行） -->
  <div class="row theme-row">
    <span class="muted">主题：</span>
    <button class="theme ghost" data-theme="Echoes" aria-pressed="false">Echoes</button>
    <button class="theme ghost" data-theme="Logic"  aria-pressed="false">Logic</button>
    <button class="theme ghost" data-theme="Emotion" aria-pressed="false">Emotion</button>
    <button class="theme ghost" data-theme="Retro" aria-pressed="false">Retro</button>
  </div>

</div>

  <!-- 文件与预检 -->
  <div class="card">
    <div class="row">
      <input type="file" id="file" class="input" accept=".json">
      <button id="runPrecheck">结构预检</button>
      <span id="status" class="muted">未加载文件</span>
    </div>
  </div>

  <div class="hero-grid">
    <div class="hero hero-overview">
      <div class="label">概览 Overview</div>
      <div class="metric-group">
        <div class="metric">
          <div class="label muted"><span id="nameU">Me</span></div>
          <div class="kpi mono nowrap kpi-row" id="uChars">0 字</div>
          <div class="kpi mono nowrap kpi-row" id="uMsgs">0 条</div>
        </div>
        <div class="metric">
          <div class="label muted"><span id="nameA">GPT</span></div>
          <div class="kpi mono nowrap kpi-row" id="aChars">0 字</div>
          <div class="kpi mono nowrap kpi-row" id="aMsgs">0 条</div>
        </div>
      </div>
    </div>

    <div class="hero hero-time">
      <div class="label">时间 Time</div>
      <div class="kpi mono"><span id="earliest">—</span></div>
      <div class="sub">本地时区，精确到小时 · 此处为最早消息时间（来自导出文件的最小时间戳）</div>
      <div class="sep"></div>
      <div class="label muted">最常聊天时段</div>
      <div class="kpi mono" id="hotSlot">—</div>
    </div>

    <div class="hero hero-streak">
      <div class="label">连续天数 Streak</div>
      <div class="hero-streak-grid">
        <div class="metric">
          <div class="label muted">当前</div>
          <div class="kpi mono" id="streakNow">—</div>
        </div>
        <div class="metric">
          <div class="label muted">最长</div>
          <div class="kpi mono" id="streakMax">—</div>
        </div>
      </div>
      <div class="sub">活跃日＝当天 <span id="nameU2">Me</span>/<span id="nameA2">GPT</span> 任一有消息</div>
    </div>
  </div>

  <!-- 指标分卡片布局 -->
  <div class="grid">
    <!-- 近三月月历字数（纯文本） -->
    <div class="card col-12">
      <div class="h2">最近三月字数分布 Monthly</div>
      <div id="monthHint" class="muted">以数字呈现</div>
      <div id="monthGrid"></div>
    </div>

  </div>

  <div class="card" id="highlights">
    <div class="h2">活跃日Top 10（近三月）</div>
    <div id="hlTopDays" class="hl-grid"></div>
  </div>

  <script type="module" src="./app.js?v=36"></script>
</body>
</html>
