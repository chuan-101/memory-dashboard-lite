<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory：Me&GPT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
/* —— Base: 扁平化、无边框、统一圆角 —— */
:root{ --radius:16px }
body{
  font-family:"Helvetica Neue", Helvetica, Lato, Futura, system-ui, Segoe UI, Roboto;
  max-width:1080px; margin:32px auto; padding:16px; line-height:1.6;
  background:var(--bg); color:var(--text);
}
h1{ font-size:28px; font-weight:800; letter-spacing:.2px; margin:0 0 16px }
.h2{ font-size:18px; font-weight:700; margin:0 0 8px }
.mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1, "lnum" 1 }
.muted{ opacity:.76 }
.kpi{ font-size:clamp(28px,4vw,32px); font-weight:800; line-height:1.1 }
.kpi-row{ margin-top:6px }
.nowrap{ white-space:nowrap; word-break:keep-all }
.label{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.8 }
.sub{ font-size:13px; opacity:.7; margin-top:8px }
.sep{ height:1px; background:currentColor; opacity:.12; margin:8px 0 }
.hero-grid{
  display:grid; gap:16px;
  grid-template-columns:repeat(12,minmax(0,1fr));
  margin:16px 0 24px;
}
.hero{
  background:var(--card);
  border-radius:28px;
  padding:24px;
  color:var(--text);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.hero .label{ margin-bottom:4px }
.hero .metric-group{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-top:4px }
.hero .metric{ display:flex; flex-direction:column; gap:4px }
.hero .metric .kpi{ margin-top:4px }
.hero .metric .kpi-row{ margin-top:6px }
.hero .metric .kpi-row:first-of-type{ margin-top:4px }
.hero .sub{ margin-top:0 }
.hero-time #earliest{ display:block; max-width:14ch; word-break:break-word }
.hero-streak-grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); }
.hero-grid .hero{ grid-column:span 12 }
.hero-time .sep{ margin:12px 0 }
.hero-time .kpi:last-of-type{ font-size:clamp(22px,3vw,26px) }
.hero-streak-grid .kpi{ font-size:clamp(24px,4vw,30px) }
.hero-streak .sub{ margin-top:12px }
.card{
  background:var(--card); border:none; border-radius:var(--radius);
  padding:16px; margin:12px 0;
}
.grid{
  display:grid; gap:12px;
  grid-template-columns: repeat(12, minmax(0,1fr));
}
.col-12{grid-column:span 12}
.col-6{grid-column:span 6}
.col-4{grid-column:span 4}
.col-8{grid-column:span 8}
@media (max-width:860px){ .col-6,.col-4,.col-8{grid-column:span 12} }
.hero-grid .hero-time,.hero-grid .hero-streak{ grid-column:span 6 }
@media (max-width:860px){ .hero-grid .hero-time,.hero-grid .hero-streak{ grid-column:span 12 } }

.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.input{ padding:8px 10px; border:none; border-radius:12px; background:var(--surface); color:var(--text) }
button{ padding:8px 12px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-contrast); cursor:pointer; font-weight:600 }
button.ghost{ background:var(--surface); color:var(--text) }
.theme{ font-weight:700; padding:6px 10px }
.theme[aria-pressed="true"]{ outline:2px solid var(--accent) }
.badge{ display:inline-block; padding:2px 8px; border-radius:999px; background:var(--accent); color:var(--accent-contrast); font-weight:700 }

#monthGrid{ display:block; margin-top:12px; }
.month{ margin:12px 0 16px; }
.month-title{ font-weight:800; font-size:16px; margin:4px 0 8px; }
.dow{ font-weight:700; text-align:center; margin:6px 0; }
.month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.day{
  min-height:60px;
  padding:8px;
  border-radius:var(--radius);
  background:var(--surface);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:flex-start;
  font-variant-numeric:tabular-nums;
}
.day.zero{ opacity:.45; }
.day.empty{ visibility:hidden; }
.day .d{ font-weight:700; }
.day .cnt{ font-size:12px; opacity:.9; }
@media (max-width:640px){ .month-grid{ gap:6px } .day{ min-height:54px; padding:6px } }

/* —— 主题（语义色：bg 最浅 / card 次浅 / surface 控件底 / accent 强调） —— */
body[data-theme="Echoes"]{
  --bg:#aac1b0; --card:#f2eee1; --surface:#a7acb7; --accent:#617ba2; --accent-contrast:#fff; --text:#102010;
}
body[data-theme="Logic"]{
  --bg:#c9c0dd; --card:#f4f4f4; --surface:#b7c1d1; --accent:#7779b5; --accent-contrast:#fff; --text:#111;
}
body[data-theme="Emotion"]{
  --bg:#e8e8e8; --card:#db8fb6; --surface:#f4d0e2; --accent:#3a3459; --accent-contrast:#fff; --text:#1a1a1a;
}
</style>

</head>

<body data-theme="Echoes">
  <h1 id="title">Memory：Me&GPT</h1>

  <!-- 控制条 -->
  <div class="card">
    <div class="row">
      <label>我方显示名（user）<input id="userName" class="input" placeholder="Me" type="text"></label>
      <label>对方显示名（assistant）<input id="assistantName" class="input" placeholder="GPT" type="text"></label>
      <button id="saveNames">保存并应用</button>
      <button id="resetNames" class="ghost">重置</button>
      <span class="badge">仅近三月统计</span>
    </div>
    <div class="row" style="margin-top:8px">
      <label><input type="radio" name="filter" value="simple" checked> 简单过滤</label>
      <label><input type="radio" name="filter" value="deep"> 深度过滤</label>
      <span style="flex:1"></span>
      <span class="muted">主题：</span>
      <button class="theme ghost" data-theme="Echoes" aria-pressed="true">Echoes</button>
      <button class="theme ghost" data-theme="Logic" aria-pressed="false">Logic</button>
      <button class="theme ghost" data-theme="Emotion" aria-pressed="false">Emotion</button>
    </div>
  </div>

  <!-- 文件与预检 -->
  <div class="card">
    <div class="row">
      <input type="file" id="file" class="input" accept=".json">
      <button id="runPrecheck">结构预检</button>
      <span id="status" class="muted">未加载文件</span>
    </div>
  </div>

  <div class="hero-grid">
    <div class="hero hero-overview">
      <div class="label">概览 Overview</div>
      <div class="metric-group">
        <div class="metric">
          <div class="label muted"><span id="nameU">Me</span></div>
          <div class="kpi mono nowrap kpi-row" id="uChars">0 字</div>
          <div class="kpi mono nowrap kpi-row" id="uMsgs">0 条</div>
        </div>
        <div class="metric">
          <div class="label muted"><span id="nameA">GPT</span></div>
          <div class="kpi mono nowrap kpi-row" id="aChars">0 字</div>
          <div class="kpi mono nowrap kpi-row" id="aMsgs">0 条</div>
        </div>
      </div>
    </div>

    <div class="hero hero-time">
      <div class="label">时间 Time</div>
      <div class="kpi mono"><span id="earliest">—</span></div>
      <div class="sub">本地时区，精确到小时</div>
      <div class="sep"></div>
      <div class="label muted">最常聊天时段</div>
      <div class="kpi mono" id="hotSlot">—</div>
    </div>

    <div class="hero hero-streak">
      <div class="label">连续天数 Streak</div>
      <div class="hero-streak-grid">
        <div class="metric">
          <div class="label muted">当前</div>
          <div class="kpi mono" id="streakNow">—</div>
        </div>
        <div class="metric">
          <div class="label muted">最长</div>
          <div class="kpi mono" id="streakMax">—</div>
        </div>
      </div>
      <div class="sub">活跃日＝当天 <span id="nameU2">Me</span>/<span id="nameA2">GPT</span> 任一有消息</div>
    </div>
  </div>

  <!-- 指标分卡片布局 -->
  <div class="grid">
    <!-- 近三月月历字数（纯文本） -->
    <div class="card col-12">
      <div class="h2">最近三月字数分布 Monthly</div>
      <div id="monthHint" class="muted">将以纯文本呈现</div>
      <div id="monthGrid"></div>
    </div>

    <!-- 关键词 Top10（纯文本卡片） -->
    <div class="card col-12">
      <div class="h2">关键词 Top10（近三月，<span id="modeText">简单过滤</span>）</div>
      <div id="kw" class="row"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
